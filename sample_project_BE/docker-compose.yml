services:
  postgres:
    image: postgres:16-alpine
    container_name: diary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-diarydb}
      POSTGRES_USER: ${DB_USERNAME:-diary}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-diary} -d ${DB_NAME:-diarydb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diary-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-diarydb}
      DB_USERNAME: ${DB_USERNAME:-diary}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Leave MAIL_PASSWORD blank in .env to run without email (dev PIN).
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      RESET_PIN_TTL_MINUTES: ${RESET_PIN_TTL_MINUTES:-15}
      RESET_PIN_MAX_ATTEMPTS: ${RESET_PIN_MAX_ATTEMPTS:-5}
      RESET_DEV_PIN: ${RESET_DEV_PIN:-1234}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
