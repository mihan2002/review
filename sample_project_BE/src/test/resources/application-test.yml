spring:
  datasource:
    url: jdbc:h2:mem:diarydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32-chars-minimum
    expiration: 3600
    issuer: diary-backend-test
