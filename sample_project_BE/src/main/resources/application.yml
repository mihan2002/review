spring:
  application:
    name: diary-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diarydb}
    username: ${DB_USERNAME:diary}
    password: ${DB_PASSWORD:diary}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Development convenience; use Flyway/Liquibase migrations for production.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # Must be supplied through the environment; no secret is ever committed.
    secret: ${JWT_SECRET}
    # Token lifetime in seconds (default 24h).
    expiration: ${JWT_EXPIRATION:86400}
    issuer: diary-backend

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.sampleproject.diary: INFO
